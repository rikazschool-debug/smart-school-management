# Only add inside the EXISTING app.kalmalki.com HTTPS server after acceptance.
# Keep the existing WATI webhook and internal-route denial unchanged.
location = /api/public/maqsam/recording {
    if ($request_method != GET) { return 405; }
    access_log off; # the one-use recording capability must never reach logs
    add_header Cache-Control "private, no-store" always;
    include snippets/rikaz-proxy.conf;
    proxy_pass http://127.0.0.1:3100;
}
location = /api/public/admissions/wordpress {
    if ($request_method != POST) { return 405; }
    client_max_body_size 64k;
    include snippets/rikaz-proxy.conf;
    proxy_pass http://127.0.0.1:3100;
}
