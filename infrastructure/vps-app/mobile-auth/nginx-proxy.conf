# REVIEW ONLY. Install as /etc/nginx/snippets/rikaz-mobile-auth-proxy.conf.
limit_req zone=rikaz_mobile_auth burst=5 nodelay;
limit_req_status 429;
client_max_body_size 2k;
client_body_timeout 10s;
proxy_connect_timeout 5s;
proxy_send_timeout 10s;
proxy_read_timeout 40s;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Replace client-supplied forwarding data. The app does not use it for identity proof.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_buffering off;
proxy_cache off;
# Preserve the public path. Never append /auth/v1 or expose /send-sms.
proxy_pass http://127.0.0.1:3100;
