# Include under http{} (sites-enabled), never inside a public server block.
# Bridge container retains --network none. Only its uid/gid can use this socket.
server {
    listen unix:/run/rikaz-adms/receiver.sock;
    server_name app.kalmalki.com;
    access_log off;
    client_max_body_size 256k;
    location = /api/integrations/adms/v1/events {
        if ($request_method != POST) { return 405; }
        proxy_set_header Host app.kalmalki.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_pass http://127.0.0.1:3100;
    }
    location / { return 404; }
}
# The existing public /api/integrations/ block remains closed.
# Application verifies HMAC, nonce, key scope, org, body size and duplicate event ids.
