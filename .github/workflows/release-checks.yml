name: فحص إصدار ركاز

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rikaz-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RIKAZ_OUTBOUND_ENABLED: "false"
      RIKAZ_DELIVERY_MODE: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned SQL parser
        run: python -m pip install --require-hashes -r infrastructure/vps-app/release/requirements.txt
      - name: Test release guards and failure paths
        run: python -m unittest discover -s infrastructure/vps-app/release -p 'test_*.py' -v
      - name: Freeze candidate source and migrations
        run: |
          mkdir -p release-artifacts
          python infrastructure/vps-app/release/release.py manifest --root . --commit "$RELEASE_SHA" --output release-artifacts/manifest.json
          python infrastructure/vps-app/release/release.py summary --manifest release-artifacts/manifest.json --output release-artifacts/summary.md
      - name: Test transactional migrations, concurrency and backups
        env:
          RK_RELEASE_DB_TESTS: "1"
        run: python -m unittest discover -s infrastructure/vps-app/release -p 'test_database.py' -v
      - name: Test proposed MCP boundary without changing production
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m --cap-drop ALL --security-opt no-new-privileges --mount type=bind,src="$PWD/infrastructure/vps-app/release/mcp-review",dst=/review,readonly --entrypoint node node@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54 /review/gateway-qa.mjs
      - name: Replay cloud schema without network or user data
        run: python infrastructure/vps-app/release/qa.py --root . --manifest release-artifacts/manifest.json --target cloud --output release-artifacts/cloud-replay.json
      - name: Replay VPS schema with its approved exception
        run: python infrastructure/vps-app/release/qa.py --root . --manifest release-artifacts/manifest.json --target vps --output release-artifacts/vps-replay.json
      - name: Existing unit tests and TypeScript
        run: |
          docker build -f infrastructure/vps-app/Dockerfile.verify -t rikaz-release-verify .
          docker run --rm --network none --memory 2g --cpus 2 rikaz-release-verify
          docker run --rm --network none --memory 2g --cpus 2 rikaz-release-verify node node_modules/typescript/bin/tsc --noEmit --pretty false
      - name: VPS build and isolated runtime
        run: |
          docker build -f infrastructure/vps-app/Dockerfile --build-arg VITE_SUPABASE_URL=http://127.0.0.1:43219 --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_RIKAZ_ISOLATED_REVIEW_ONLY -t rikaz-release-node .
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges --mount type=bind,src="$PWD/infrastructure/vps-app/isolated-smoke.mjs",dst=/verify/smoke.mjs,readonly --entrypoint node rikaz-release-node /verify/smoke.mjs
      - name: Preserve Lovable Cloudflare build
        run: docker run --rm --network none --memory 3g --cpus 2 -e LOVABLE_SANDBOX=1 -e LOVABLE_NITRO_PRESET=cloudflare-module -e NITRO_PRESET=node-server rikaz-release-verify /bin/sh -ec 'node node_modules/vite/bin/vite.js build; test -s dist/server/index.mjs; test -d dist/client'
      - name: Publish review summary
        if: always()
        run: |
          if [ -f release-artifacts/summary.md ]; then cat release-artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          printf '\nاختبارات معزولة فقط؛ لا نشر ولا مزودو رسائل حقيقيون.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: release-candidate
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
