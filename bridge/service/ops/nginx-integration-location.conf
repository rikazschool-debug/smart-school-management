# Include inside attendance.kalmalki.com's TLS server only.
# Requires existing rikaz-proxy.conf, admin Unix socket and a signed backend.
# Do not put this on app/api/studio, /manage, or /iclock.
location ^~ /integration/v1/ {
    auth_basic off;
    client_max_body_size 1k;
    include snippets/rikaz-proxy.conf;
    proxy_pass http://unix:/run/rikaz-adms/admin.sock:;
}
