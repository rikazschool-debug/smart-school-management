# Include inside the numeric-IP HTTP and attendance HTTPS servers only.
location = /_adms/check {
    internal;
    auth_basic off;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-ADMS-Original-URI $request_uri;
    proxy_set_header X-ADMS-Transport $rikaz_adms_transport;
    proxy_set_header X-ADMS-HTTPS $rikaz_adms_https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    include /etc/nginx/snippets/rikaz-adms-edge-key.conf;
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 5s;
    proxy_cache off;
    proxy_pass http://unix:/run/rikaz-adms/intake.sock:/_adms/authorize;
}
